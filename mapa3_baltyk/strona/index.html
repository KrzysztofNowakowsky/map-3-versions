<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sinice w Zatoce Gdańskiej • lato 2026</title>
<link rel="stylesheet" href="vendor/leaflet.css">
  <style>
    :root {
      --navy: #0b3954;
      --navy-light: #155779;
      --blue: #1976d2;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #183247;
      --muted: #63798b;
      --border: #dce6ef;
      --red: #b31243;
      --radius: 16px;
      --shadow: 0 5px 22px rgba(20, 55, 80, .07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    /* NAGŁÓWEK */

    header {
      position: relative;
      padding: 22px 30px;
      color: #fff;
      background: linear-gradient(115deg, #082e46, #105477);
      border-bottom: 3px solid #35b6c7;
    }

    header h1 {
      margin: 0;
      font-size: clamp(21px, 2.2vw, 30px);
      line-height: 1.25;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    header p {
      margin: 7px 0 0;
      color: #c8e1ef;
      font-size: 14px;
      letter-spacing: .2px;
    }

    /* MAPA I PANEL */

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
      padding: 20px;
      min-height: 610px;
      height: min(760px, calc(100vh - 100px));
    }

    #mapa {
      min-width: 0;
      height: 100%;
      border: 1px solid #d6e2eb;
      border-radius: var(--radius);
      overflow: hidden;
      background: #dce8ef;
      box-shadow: var(--shadow);
      z-index: 0;
    }

    .leaflet-container {
      font: inherit;
    }

    .leaflet-control-zoom a {
      color: var(--navy) !important;
    }

    .leaflet-control-attribution {
      font-size: 10px !important;
    }

    aside {
      min-width: 0;
      padding: 23px;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    aside h2 {
      margin: 0 0 20px;
      color: var(--navy);
      font-size: 21px;
      font-weight: 750;
      letter-spacing: -.3px;
    }

    /* POLA FORMULARZA */

    label {
      display: block;
      margin: 19px 0 7px;
      color: #29485f;
      font-size: 13px;
      font-weight: 700;
    }

    select {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      margin: 0;
      color: var(--text);
      font: inherit;
      background: #fafdff;
      border: 1px solid #cddce8;
      border-radius: 9px;
      outline: none;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
    }

    select:hover {
      border-color: #8eafc7;
    }

    select:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(25, 118, 210, .2);
      outline-offset: 2px;
    }

    /* LEGENDA MCI */

    #legenda {
      margin-top: 17px;
      padding: 14px;
      background: #f5f9fc;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .rampa {
      height: 16px;
      margin: 0 0 8px;
      border-radius: 5px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    }

    .skala {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    /* STATYSTYKA ZAKWITU */

    .wynik {
      margin-top: 2px;
      color: var(--red);
      font-size: clamp(36px, 4vw, 46px);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -1.5px;
      font-variant-numeric: tabular-nums;
    }

    aside > label:has(+ #zakwit) {
      margin-top: 24px;
    }

    .opis {
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.75;
    }

    #szczegoly {
      margin: 8px 0 18px;
      color: #405b70;
      overflow-wrap: anywhere;
    }

    aside > .opis:last-child {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    /* WYKRESY */

    #wykresy {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      padding: 0 20px 16px;
      background: var(--bg);
    }

    .wykres {
      position: relative;
      min-width: 0;
      height: 340px;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    #zrodlo-sst {
      grid-column: 1 / -1;
      margin: 0;
      padding: 0 3px;
      font-size: 12px;
    }

    /* PASKI PRZEWIJANIA */

    * {
      scrollbar-width: thin;
      scrollbar-color: #b8cad8 transparent;
    }

    /* RESPONSYWNOŚĆ */

    @media (min-width: 1500px) {
      main {
        grid-template-columns: minmax(0, 1fr) 370px;
      }

      .wykres {
        height: 370px;
      }
    }

    @media (max-width: 1000px) {
      main {
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 12px;
        padding: 12px;
        min-height: 560px;
      }

      aside {
        padding: 18px;
      }

      #wykresy {
        gap: 12px;
        padding: 0 12px 12px;
      }

      .wykres {
        height: 300px;
        padding: 14px;
      }
    }

    @media (max-width: 760px) {
      header {
        padding: 19px 17px;
      }

      header p {
        font-size: 12px;
      }

      main {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 0;
        padding: 12px;
        gap: 12px;
      }

      #mapa {
        height: 55vh;
        min-height: 340px;
        max-height: 570px;
        flex-shrink: 0;
      }

      aside {
        padding: 19px;
        overflow: visible;
      }

      aside h2 {
        margin-bottom: 14px;
      }

      #wykresy {
        grid-template-columns: minmax(0, 1fr);
        padding: 0 12px 16px;
        gap: 12px;
      }

      .wykres {
        height: 300px;
      }

      #zrodlo-sst {
        grid-column: auto;
      }
    }

    @media (max-width: 380px) {
      header h1 {
        font-size: 20px;
      }

      #mapa {
        min-height: 290px;
      }

      aside {
        padding: 15px;
      }

      .wykres {
        height: 260px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
<header>
  <h1>Sinice w Zatoce Gdańskiej • lato 2026</h1>
  <p>Sentinel-2 • indeks MCI (Maximum Chlorophyll Index) • AGH, projekt grupowy</p>
</header>
<main>
  <div id="mapa" aria-label="Mapa zakwitów"></div>
  <aside>
    <h2>Wybór sceny</h2>
    <label for="data">Data zdjęcia</label>
    <select id="data"></select>
    <label for="warstwa">Warstwa</label>
    <select id="warstwa">
      <option value="mci">MCI (chlorofil)</option>
      <option value="rgb">Prawdziwe kolory (RGB)</option>
    </select>
    <div id="legenda">
      <div id="rampa" class="rampa"></div>
      <div class="skala"><span id="od"></span><span>MCI</span><span id="do"></span></div>
    </div>
    <label>Zakwit w zatoce</label>
    <div class="wynik" id="zakwit">–</div>
    <p class="opis" id="szczegoly"></p>
    <p class="opis">MCI = B5 − 0,4667·B4 − 0,5333·B6 (×10000). Zakwit: MCI powyżej progu, liczony tylko na wodzie bez chmur.
      Szare/puste miejsca = chmury lub ląd.</p>
  </aside>
</main>
<section id="wykresy" aria-label="Wykresy zakwitu">
  <div class="wykres"><canvas id="wykres-sezon"></canvas></div>
  <div class="wykres"><canvas id="wykres-lata"></canvas></div>
  <p class="opis" id="zrodlo-sst"></p>
</section>
<script src="vendor/leaflet.js"></script>
<script>
const mapa = L.map('mapa').setView([54.58, 18.85], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 16, attribution: '© OpenStreetMap • Sentinel-2: Copernicus/ESA'
}).addTo(mapa);
let warstwa = null, sceny = [];

function pokaz() {
  const data = document.querySelector('#data').value;
  const typ = document.querySelector('#warstwa').value;
  if (warstwa) mapa.removeLayer(warstwa);
  warstwa = L.tileLayer(`kafelki/${typ}/${data}/{z}/{x}/{y}.png`, {
    minZoom: 9, maxNativeZoom: 11, maxZoom: 16, opacity: typ === 'mci' ? 0.9 : 1
  }).addTo(mapa);
  document.querySelector('#legenda').hidden = typ !== 'mci';
  const s = sceny.find(x => x.data === data);
  document.querySelector('#zakwit').textContent = s.zakwit_pct === null ? 'brak danych' : s.zakwit_pct + '%';
  document.querySelector('#szczegoly').textContent =
    `Widoczne (bez chmur): ${s.wazne_pct}% zatoki` + (s.mci_mediana === null
      ? ' • za mało czystej wody, by liczyć zakwit' : ` • mediana MCI: ${s.mci_mediana}`)
    + (s.uzupelnione_z ? ` • Zatoka Pucka uzupełniona z dnia ${s.uzupelnione_z} (tego dnia satelita jej nie objął)` : '')
    + (s.chmury_uzupelnione_pct > 0 ? ` • ${s.chmury_uzupelnione_pct}% zatoki spod chmur uzupełniono z dni: ${s.chmury_z.join(', ')} (przygaszone kolory; % zakwitu liczony tylko z tego dnia)` : '');
}

fetch('sceny.json').then(r => r.json()).then(cfg => {
  sceny = cfg.sceny;
  const tytul = `Sinice w Zatoce Gdańskiej • lato ${cfg.rok}`;
  document.title = tytul;
  document.querySelector('header h1').textContent = tytul;
  const wybor = document.querySelector('#data');
  sceny.forEach(s => wybor.add(new Option(
    `${s.data} (${s.zakwit_pct === null ? 'brak danych' : 'zakwit ' + s.zakwit_pct + '%'})`, s.data)));
  document.querySelector('#rampa').style.background = `linear-gradient(to right, ${cfg.legenda.kolory.join(',')})`;
  document.querySelector('#od').textContent = cfg.legenda.od;
  document.querySelector('#do').textContent = cfg.legenda.do;
  wybor.addEventListener('change', pokaz);
  document.querySelector('#warstwa').addEventListener('change', pokaz);
  pokaz();
});
fetch('zatoka.geojson').then(r => r.json()).then(g =>
  L.geoJSON(g, { style: { color: '#0b3954', weight: 1, fill: false, dashArray: '4 4' } }).addTo(mapa));
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="wykresy.js"></script>
</body>
</html>
