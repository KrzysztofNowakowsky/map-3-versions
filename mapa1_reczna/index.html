
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Mapy Landsat 8 - powiat krakowski</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // -------------------------
    // Mapa
    // -------------------------

    const map = L.map('map').setView([50.0614, 19.9366], 10);


    // -------------------------
    // OSM
    // -------------------------

    const osm = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    );


    // -------------------------
    // Puste tło
    // -------------------------

    const noBackground = L.layerGroup();


    // -------------------------
    // Warstwy rastrowe
    // -------------------------

    const ndvi = L.tileLayer(
        'tiles_ndvi/{z}/{x}/{y}.png',
        {
            opacity: 0.7,
            tms: false,
            minZoom: 8,
            maxZoom: 14
        }
    );


    // Domyślne warstwy

    osm.addTo(map);
    ndvi.addTo(map);


    // -------------------------
    // Kontrola warstw
    // -------------------------

    const baseMaps = {
        "OpenStreetMap": osm,
        "Bez tła": noBackground
    };

    const overlayMaps = {
        "NDVI": ndvi,
    };

    L.control.layers(
        baseMaps,
        overlayMaps,
        {
            collapsed: false
        }
    ).addTo(map);

</script>

</body>
</html>
